name: release

# 手动触发的备用出包通道。默认发版走本地：
#   本地构建 → git push tag → make_gitee_release.py / make_github_release.py 两端上传。
#
# 2026-10-30 改动（重要）：
#   1. 去掉 push tag 触发 —— 之前推任何 v* tag 都会触发本工作流，而它最后一步会
#      「删掉除当前 tag 外的所有 Release 和 tag」，一旦 secrets 配齐就会误删历史 tag。
#   2. 删掉「只留最新一版」的删除逻辑：本工作流只负责出包，不删除任何远端内容。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在，如 v0.2.46）'
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # 必须用正式 keystore 签名：否则 CI 出的包与本地签名不同，用户覆盖安装会被当成新装。
      # 没配 secrets 时直接失败——宁可不出包，也不发 debug 签名的坏包。
      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64，拒绝用 debug 签名发布（会破坏覆盖安装）。请先按 SECRETS-SETUP 配置 secrets。"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=${KEY_ALIAS:-musicorganizer}"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties
          echo "release keystore configured"

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p out
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed 's/^app-//; s/-release\.apk$//')
            cp "$f" "out/musicorganizer-${abi}.apk"
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath out\musicorganizer-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: out/musicorganizer-windows-x64.zip

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: ls -l dist

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then echo "缺少 tag 输入"; exit 1; fi
          git fetch --tags --force
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG 不存在，请先 git push 该 tag"; exit 1
          fi
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md 2>/dev/null || \
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes

      # 注意：这里不再删除任何旧 Release /旧 tag。
      # 历史版本由本地 cleanup_gitee_releases.py（Gitee）或人工处理。
