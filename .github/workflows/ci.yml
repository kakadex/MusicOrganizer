name: ci

# 推到 main 或开 PR 时做质量门禁：依赖安装 + 静态分析 + 单元测试 + APK 构建。
# Windows 桌面构建不在 CI 跑（跨平台无法在 Linux 上编），由 release.yml 在 windows-latest 上出包。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK (release, split per ABI)
        run: flutter build apk --split-per-abi --release
