name: ci

# 推到 main 或开 PR 时做质量门禁：依赖安装 + 静态分析 + 单元测试 + APK 构建。
# Windows 桌面构建不在 CI 跑（跨平台无法在 Linux 上编），由 release.yml 在 windows-latest 上出包。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          # 锁定版本，不要再用浮动的 `stable`。
          # 原因：`--fatal-infos` 把 info 级提示也算失败，而上游 stable 每隔几周
          # 就会新增或调整 lint 与 analyzer 提示 —— 代码一个字没改，CI 也会突然变红，
          # 这就是之前「偶发红」的来源。锁到发版用的同一条工具链（3.47.8）之后，
          # 本地 `dart analyze` 与 CI 的结论就一致了；升级 Flutter 时两边一起改。
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 注意：下面的 build 步骤**不要**加 `--no-pub`。
      # 2026-10-31 实测踩坑：加了之后 `flutter build apk` 不再刷新插件注册表，
      # 会沿用上一步 `flutter test` 生成的 GeneratedPluginRegistrant（里面带
      # integration_test 这个 dev 插件），而 release 的 Gradle 依赖里没有它，
      # 于是 javac 报 `package dev.flutter.plugins.integration_test does not exist`。
      # pub get 本身有缓存，省这一步没意义。

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build APK (release, split per ABI)
        # CI 环境没有 key.properties，正式签名闸会让 release 构建直接失败。
        # CI 产物不用于发布（发版走本地构建 + 两端 API 上传），这里只为验证
        # 「能编过」，所以显式允许 debug 签名。
        run: flutter build apk --split-per-abi --release -PallowDebugSign=true
