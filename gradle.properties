org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=false
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
# 项目现已位于纯 ASCII 路径；
# 保留该开关，以防将来目录名再出现中文时 AGP 报 "non-ASCII path"（b.android.com/95744）
android.overridePathCheck=true

# 本机可直连 Google / 阿里云镜像，无需代理。
# 若你的网络必须走代理，再取消下面注释并改成实际端口：
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890
# Gradle 须用 JDK 17 运行（Gradle 8.9 不支持更高版本的 JDK）。
# 这里**不要**写死 org.gradle.java.home=<本机 JDK 路径> —— 那是本机路径，
# 一提交上去，别人（和 GitHub Actions 的 runner）克隆后构建就会直接失败：
#   Value '<本机 JDK 路径>' given for org.gradle.java.home is invalid
# 正确做法：由 build.sh 导出 JAVA_HOME（便携 env/jdk17 或你已装的 JDK 17），
# Gradle 自己会取 JAVA_HOME 指向的 JDK。
